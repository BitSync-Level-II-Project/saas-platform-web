name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check project
        run: npm run check

      - name: API unit tests
        if: github.event.repository.name == 'saas-platform-api'
        run: npm test -- --runInBand

      - name: Web lint
        if: github.event.repository.name == 'saas-platform-web'
        run: npm run lint