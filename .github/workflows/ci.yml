name: Web CI

on:
  pull_request:
    branches:
      - main
      - chore/web-foundation

  push:
    branches:
      - main
      - chore/web-foundation
      - feature/template-builder

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    env:
      VITE_API_URL: http://localhost:3000/api/v1

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run check

      - name: Lint frontend
        run: npm run lint